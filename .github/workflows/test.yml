name: Проверка игры

on:
  push:
    branches-ignore: ["main"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # данные: достижимость карт, квесты, предметы
      - run: node tests/validate.mjs
      # быстрый прогон логики мира для трёх классов
      - run: node tests/smoke.mjs
      # бот проходит игру целиком через настоящую логику
      - run: node tests/bot.mjs warrior --quiet
